<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Projects – GT POWER SOLUTIONS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Banner Header -->
 <header class="banner">
  <div class="banner-container">

    <div class="logo-title">
      <img src="banner.jpg" alt="GT Power Solutions Logo">
    </div>

    <!-- Hamburger Button -->
    <div class="menu-toggle" id="mobile-menu">
      ☰
    </div>

    <nav class="nav-links" id="nav-links">
      <a href="./index.html">🏠 Home</a>
      <a href="./services.html">⚡ Services</a>
      <a href="./projects.html" class="active">🔧 Projects</a>
      <a href="./contact.html" >📞 Contact</a>
    </nav>

  </div>
</header>


  <section class="gallery fade-in">
    <h2>Our Projects</h2>

    <img src="work1.jpg" alt="Electrical Project 1">
    <img src="work2.jpg" alt="Electrical Project 2">

  </section>

  <footer class="footer">
  <div class="footer-content">
    <img src="banner.jpg" alt="GT Power Solutions Logo">
    <p>© 2025 GT POWER SOLUTIONS. All Rights Reserved.</p>
  </div>
</footer>
<script>
  const menu = document.getElementById("mobile-menu");
  const navLinks = document.getElementById("nav-links");

  menu.addEventListener("click", () => {
    navLinks.classList.toggle("active");
  });
  
  const faders = document.querySelectorAll('.fade-in');

  const appearOptions = {
    threshold: 0.2
  };

  const appearOnScroll = new IntersectionObserver(function(entries, observer) {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      entry.target.classList.add('visible');
      observer.unobserve(entry.target);
    });
  }, appearOptions);

  faders.forEach(fader => {
    appearOnScroll.observe(fader);
  });
</script>


</body>
</html>
